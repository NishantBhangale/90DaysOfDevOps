services:
  postgresql:
    image: postgres:16
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: realestate
    volumes:
      - hozn_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d realestate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hozn-net
  
  backend:
    build: ./real-estate-backend
    container_name: hozn-backend
    env_file:
      - ./real-estate-backend/.env
    ports:
      - "${BACKEND_PORT}:5000"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - hozn-net
  
  frontend:
    build: ./
    container_name: hozn-frontend
    env_file:
      - ./.env
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - hozn-net
volumes:
  hozn_data:  
    name: hozn_data
networks:
  hozn-net:
    name: hozn-net
    driver: bridge